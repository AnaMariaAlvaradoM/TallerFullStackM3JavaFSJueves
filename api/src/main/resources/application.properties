# Configuración principal de Llave Maestra
# Las variables de entorno se leen desde api/.env en desarrollo

# JWT - la clave viene de la variable de entorno JWT_SECRET; si no existe, usa el valor de desarrollo
jwt.secret=${JWT_SECRET:llave-maestra-clave-secreta-de-desarrollo-2026-segura}
jwt.expiration=86400000

# Base de datos - en producción usa variables de entorno
spring.datasource.url=${URL:jdbc:postgresql://localhost:5432/llave_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=8080
spring.application.name=llave-maestra-api
