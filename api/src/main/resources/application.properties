spring.application.name=llave-maestra-api
server.port=8080

# ---------- Base de datos ----------
# Crea la base vacia llave_db en pgAdmin antes de arrancar.
# ${DB_PASSWORD:postgres} = usa la variable de entorno DB_PASSWORD; si no existe, usa "postgres".
spring.datasource.url=jdbc:postgresql://localhost:5432/llave_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:544695}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false

# ---------- JWT ----------
# La clave debe tener al menos 32 caracteres. En produccion va en una variable de entorno.
jwt.secret=${JWT_SECRET:llave-maestra-clave-secreta-desarrollo-2026-segura}
jwt.expiration=86400000

# ---------- Swagger ----------
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
