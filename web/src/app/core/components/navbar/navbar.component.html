<nav class="bg-blue-600 shadow-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      <div class="flex items-center space-x-8">
        <span class="text-white font-bold text-xl tracking-wide">Llave Maestra</span>

        @if (authService.isLoggedIn()) {
        <div class="hidden md:flex space-x-4">
          <a routerLink="/herramientas" routerLinkActive="bg-blue-700 text-white"
            class="text-blue-100 hover:bg-blue-500 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">
            Herramientas
          </a>

          @if (authService.tienePermiso('CLIENTES_GESTIONAR')) {
          <a routerLink="/usuarios" routerLinkActive="bg-blue-700 text-white"
            class="text-blue-100 hover:bg-blue-500 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">
            Gestión de Usuarios
          </a>
          }
        </div>
        }
      </div>

      <div class="flex items-center">
        @if (authService.isLoggedIn()) {
        <button (click)="onLogout()"
          class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors shadow-sm">
          Cerrar Sesión
        </button>
        }
      </div>
    </div>
  </div>
</nav>
