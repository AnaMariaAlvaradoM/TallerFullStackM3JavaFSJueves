<div class="min-h-screen flex items-center justify-center bg-gray-100 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg border border-gray-200">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        Llave Maestra
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Ingrese sus credenciales para acceder al sistema
      </p>
    </div>

    <!-- Alerta de Error de Autenticación -->
    @if (errorMessage()) {
    <div class="p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm">
      {{ errorMessage() }}
    </div>
    }

    <form class="mt-8 space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="rounded-md shadow-sm space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
          <input id="email" type="email" formControlName="email" required
            class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
            placeholder="admin@llavemaestra.com">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <input id="password" type="password" formControlName="password" required
            class="appearance-none rounded-md relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
            placeholder="••••••••">
        </div>
      </div>

      <div>
        <button type="submit" [disabled]="loginForm.invalid || cargando()"
          class="group relative w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 transition-colors">
          @if (cargando()) {
          <span>Iniciando sesión...</span>
          } @else {
          <span>Ingresar</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>
