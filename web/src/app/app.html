@if (authService.sesionActiva()) {
  <header class="barra-superior">
    <div class="logo">Llave Maestra</div>
    <div class="usuario-info">
      <span data-testid="nombre-usuario">{{ authService.nombre() }}</span>
      <button data-testid="cerrar-sesion" (click)="authService.cerrarSesion()">Cerrar sesión</button>
    </div>
  </header>

  <div class="contenedor-principal">
    <aside class="menu-lateral">
      <nav>
        @if (authService.puede('HERRAMIENTAS_VER')) {
          <a routerLink="/herramientas" routerLinkActive="activo" data-testid="menu-herramientas">
            Herramientas
          </a>
        }
        @if (authService.puede('CLIENTES_GESTIONAR')) {
          <a routerLink="/clientes" routerLinkActive="activo" data-testid="menu-clientes">
            Clientes
          </a>
        }
      </nav>
    </aside>

    <main class="contenido">
      <router-outlet></router-outlet>
    </main>
  </div>
} @else {
  <router-outlet></router-outlet>
}
