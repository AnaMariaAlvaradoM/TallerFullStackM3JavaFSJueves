@if (authservice.sesionActiva()) {
  <div class="app">
    <aside class="lateral">
      <a routerLink="/herramientas" class="marca">
        <img src="favicon.svg" alt="" width="36" height="36">
        <span>LLave <small>Maestra</small></span>
      </a>
      <nav class="menu" aria-label="Menu principal" >
        @for (enlace of enlaces(); track enlace.ruta) {
          <a [routerLink]="enlace.ruta" routerLinkActive="activo" class="menu-enlace" [attr.data-testid]="enlace.testid">
            {{ enlace.texto }} 
          </a>
        }
      </nav>

      <details class="acceso">
        <summary>Tu acceso</summary>
        <ul>
          @for (permiso of authservice.permisos(); track permiso) {
            <li> {{descripcionPermiso[permiso]}}</li>
          }
        </ul>
      </details>
    </aside>

    <div class="principal">
      <header class="barra">
      <p class="saludo">
        Hola, <strong  data-testid="nombre-usuario"> {{authservice.nombre()}}</strong>
        <span class="chip"[class.chip-naranja]="authservice.rol()== 'ADMIN'"
          [class.chip-miel]="authservice.rol() === 'USER'">{{ nombreRol() }}</span>
      </p>

      <button type="button" class="btn btn-secundario btn-sm" (click)="authservice.cerrarSesion()" data-testid="cerrar-sesion">
        Cerrar sesion
      </button>
    </header>

    <main class="contenido">
      <router-outlet/>
    </main>
    </div>

  </div>
}@else {
  <router-outlet/>
}


<main class="bienvenida">
  <router-outlet />
</main>
